<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOEFL Speaking Test-1 Practice</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    h1 { text-align: center; }
    #question { margin: 20px 0; font-size: 1.3em; min-height: 80px; color: #333; }
    #timer { font-size: 2em; color: #d9534f; text-align: center; margin: 15px 0; }
    #startBtn { display: block; margin: 20px auto; padding: 10px 20px; font-size: 1.2em; cursor: pointer; }
  </style>
</head>
<body>
  <h1>TOEFL Speaking Test-1 Practice</h1>
  <button id="startBtn">Start Test</button>
  <div id="question"></div>
  <div id="timer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const questions = [
        "Describe your hometown.",
        "What is your favorite season of the year? Explain why.",
        "Describe a memorable event in your life.",
        // ... (include all 100 questions here)
        "What is your favorite place to study?"
      ];

      const prepTime = 15; // seconds
      const responseTime = 45; // seconds
      let timerInterval;

      const startBtn = document.getElementById('startBtn');
      const questionDiv = document.getElementById('question');
      const timerDiv = document.getElementById('timer');

      function startTimer(seconds, onTick, onComplete) {
        let timeLeft = seconds;
        onTick(timeLeft);
        timerInterval = setInterval(() => {
          timeLeft--;
          if (timeLeft < 0) {
            clearInterval(timerInterval);
            onComplete();
          } else {
            onTick(timeLeft);
          }
        }, 1000);
      }

      function startTest() {
        startBtn.disabled = true;
        // Pick a random question
        const questionIndex = Math.floor(Math.random() * questions.length);
        questionDiv.textContent = questions[questionIndex];

        // Start prep timer
        timerDiv.textContent = 'Preparation Time: ' + prepTime + ' seconds';
        startTimer(prepTime,
          (t) => { timerDiv.textContent = 'Preparation Time: ' + t + ' seconds'; },
          () => {
            // After prep timer ends, start response timer
            timerDiv.textContent = 'Response Time: ' + responseTime + ' seconds';
            startTimer(responseTime,
              (t) => { timerDiv.textContent = 'Response Time: ' + t + ' seconds'; },
              () => {
                timerDiv.textContent = 'Time is up! Click Start to try another question.';
                startBtn.disabled = false;
              }
            );
          }
        );
      }

      startBtn.addEventListener('click', startTest);
    });
  </script>
</body>
</html>
