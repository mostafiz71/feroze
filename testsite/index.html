<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOEFL Speaking Task 1 Practice</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    h1 { text-align: center; }
    #question { margin: 20px 0; font-size: 1.3em; min-height: 80px; color: #333; }
    #timer { font-size: 2em; color: #d9534f; text-align: center; margin: 15px 0; }
    #startBtn { display: block; margin: 20px auto; padding: 10px 20px; font-size: 1.2em; cursor: pointer; }
  </style>
</head>
<body>
  <h1>TOEFL Speaking Task 1 Practice</h1>
  <button id="startBtn">Start Test</button>
  <div id="question"></div>
  <div id="timer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const questions = [
        "Do you think it is better to study at home or at the library? Explain why.",
        "Should college students take courses in many different fields or focus on one subject? Why?",
        "Do you agree or disagree that all students should live on campus their first year?",
        "Would you prefer to use a tablet or a laptop for your studies? Why?",
        "Should universities offer more career counseling services or more academic support programs?",
        "Do you think students benefit more from group projects or individual assignments? Explain your choice.",
        "Would you rather attend classes in the morning or in the afternoon? Why?",
        "Should students be required to take physical education classes? Why or why not?",
        "Do you agree or disagree that technology makes learning easier? Provide reasons.",
        "Is it better to study with music or in complete silence? Explain your opinion.",
        "Would you prefer to have exams or continuous assessments during a course? Why?",
        "Should students focus more on theoretical knowledge or practical skills? Explain your view.",
        "Is it better to live close to school or far away with a longer commute? Why?",
        "Do you agree or disagree that students should participate in extracurricular activities?",
        "Would you rather write papers by hand or on a computer? Explain your preference.",
        "Should schools have longer holidays or shorter but more frequent breaks? Why?",
        "Do you think students should have part-time jobs while studying? Explain your opinion.",
        "Would you prefer a large university or a small college? Why?",
        "Do you agree or disagree that attending lectures is more important than reading textbooks?",
        "Should students be required to learn a foreign language? Why or why not?",
        "Is it better to study alone or with friends? Provide reasons for your choice.",
        "Do you think school uniforms are necessary? Explain your view.",
        "Would you prefer to take online classes or traditional in-person classes? Why?",
        "Should schools focus more on arts education or science education? Explain your view.",
        "Is it better to have open-book exams or closed-book exams? Why?",
        "Do you agree or disagree that high school students should decide their own subjects?",
        "Would you rather study in a classroom or outdoors? Explain your reasons.",
        "Should students have more homework or fewer assignments to focus on other activities?",
        "Is it better to have a strict or flexible attendance policy? Provide your opinion.",
        "Do you agree or disagree that sports are important for students' development?",
        "Would you prefer classes to be longer and less frequent or shorter but more frequent? Why?",
        "Should schools provide free meals for students? Explain your view.",
        "Do you think students should use social media during breaks or avoid it completely?",
        "Would you rather take part in a debate or write an essay to express your opinion? Why?",
        "Should teachers use more visual aids or rely on verbal explanations?",
        "Is it better to have a lot of group discussions or lectures in class? Explain why.",
        "Do you agree or disagree that schools should teach financial literacy?",
        "Would you prefer to learn through videos or reading materials? Why?",
        "Should students be allowed to choose their own projects or have assigned topics?",
        "Is it better to have standardized tests or teacher-made exams? Provide your opinion.",
        "Do you think students benefit from studying abroad? Explain your view.",
        "Would you rather have many classes in one day or fewer classes spread out? Why?",
        "Should students take notes by hand or use a laptop during lectures?",
        "Do you agree or disagree that homework is necessary for learning?",
        "Would you prefer to study early in the morning or late at night? Explain.",
        "Should schools provide mental health support for students? Why?",
        "Is it better to learn by doing experiments or by reading about them?",
        "Do you think competitive sports should be included in school programs? Explain your view.",
        "Would you rather attend a school with many international students or mostly local students?",
        "Should students have more opportunities for arts and music education? Why?",
        "Do you agree or disagree that online resources can replace textbooks?",
        "Would you rather have open discussions or formal lectures during class? Explain your preference.",
        "Should schools encourage students to volunteer in their community? Why?",
        "Is it better to start school earlier or later in the day? Provide reasons.",
        "Do you think students should plan their own study schedules? Explain.",
        "Would you prefer to work on creative projects or analytical assignments? Why?",
        "Should schools focus more on preparing students for jobs or for further study?",
        "Is it better to have exams at the end of each module or at the end of the year?",
        "Do you agree or disagree that physical exercise improves academic performance?",
        "Would you rather have more group work or more independent study? Explain.",
        "Should students be graded more on participation or on exams? Why?",
        "Do you think learning a second language is important? Explain your reasons.",
        "Would you prefer to study in a quiet library or a lively café? Why?",
        "Should universities require internships? Provide your opinion.",
        "Is it better to take many short breaks or fewer long breaks when studying?",
        "Do you agree or disagree that technology can be a distraction in class?",
        "Would you rather have classes five days a week or only three? Explain your preference.",
        "Should schools teach more about environmental issues? Why?",
        "Is it better to read stories or listen to lectures to learn a new subject?",
        "Do you think attendance should affect students’ grades? Explain.",
        "Would you rather take courses that are interesting or courses that are useful for your career?",
        "Should schools provide more support for students with learning difficulties?",
        "Is it better to have competitive or cooperative learning activities? Provide reasons.",
        "Do you agree or disagree that students should use tablets instead of textbooks?",
        "Would you prefer to study in a group or by yourself? Why?",
        "Should schools have dress codes? Explain your view.",
        "Is it better for students to specialize early or study many subjects?",
        "Do you think test scores are a good way to measure knowledge?",
        "Would you rather attend a university in your home country or overseas?",
        "Should community service be required for high school graduation? Explain.",
        "Is it better to have small classes or large lecture halls? Why?",
        "Do you agree or disagree that students should learn coding?",
        "Would you prefer to study in a classroom with windows or without?",
        "Should schools teach more about healthy eating? Why?",
        "Is it better to start college at a community college or a university? Provide reasons.",
        "Do you think it is better to rent or buy textbooks? Explain.",
        "Would you prefer online exams or in-person exams? Why?",
        "Should schools have longer school days or more school days in a week?",
        "Is it better to study in the library or café? Provide your views.",
        "Do you agree or disagree that homework should be optional?",
        "Would you rather have a professor who lectures or one who encourages discussion?",
        "Should students be evaluated on creativity or accuracy? Explain.",
        "Is it better to have courses graded on pass/fail or letter grades?",
        "Do you think schools should teach more foreign languages? Why?",
        "Would you prefer courses with a lot of reading or lots of hands-on activities?",
        "Should students be allowed to eat in class? Provide reasons.",
        "Is it better to study in the morning or the evening? Explain your opinion.",
        "Do you agree or disagree that scholarships motivate students to study harder?",
        "Would you prefer a campus with many social activities or quiet study spaces?",
        "Should students have a say in campus policies? Why or why not?"
      ];

      const prepTime = 15; // seconds
      const responseTime = 45; // seconds
      let timerInterval;

      const startBtn = document.getElementById('startBtn');
      const questionDiv = document.getElementById('question');
      const timerDiv = document.getElementById('timer');

      const beepSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

      function speak(text, onEnd) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onend = onEnd;
        speechSynthesis.speak(utterance);
      }

      function startTimer(seconds, onTick, onComplete) {
        let timeLeft = seconds;
        onTick(timeLeft);
        timerInterval = setInterval(() => {
          timeLeft--;
          if (timeLeft < 0) {
            clearInterval(timerInterval);
            onComplete();
          } else {
            onTick(timeLeft);
          }
        }, 1000);
      }

      function startTest() {
        startBtn.disabled = true;
        const questionIndex = Math.floor(Math.random() * questions.length);
        const questionText = questions[questionIndex];
        questionDiv.textContent = questionText;

        speak(questionText, () => {
          speak("Start preparing your response", () => {
            timerDiv.textContent = 'Preparation Time: ' + prepTime + ' seconds';
            startTimer(prepTime,
              (t) => { timerDiv.textContent = 'Preparation Time: ' + t + ' seconds'; },
              () => {
                speak("Now record your response after the beep", () => {
                  setTimeout(() => {
                    beepSound.play();
                  }, 300);
                });
                beepSound.onended = () => {
                  timerDiv.textContent = 'Response Time: ' + responseTime + ' seconds';
                  startTimer(responseTime,
                    (t) => { timerDiv.textContent = 'Response Time: ' + t + ' seconds'; },
                    () => {
                      timerDiv.textContent = 'Time is up! Click Start to try another question.';
                      startBtn.disabled = false;
                    }
                  );
                };
              }
            );
          });
        });
      }

      startBtn.addEventListener('click', startTest);
    });
  </script>
</body>
</html>
